
name: delivary_partner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  go_router: ^17.1.0
  toastification: ^3.0.3
  shared_preferences: ^2.5.4
  hooks_riverpod: ^3.2.1
  flutter_screenutil_plus: ^1.4.0
  dio: ^5.9.1
  flutter_secure_storage: ^10.0.0
  flutter_hooks: ^0.21.3+1
  flutter_native_splash: ^2.4.7
  flex_color_scheme: ^8.4.0
  google_fonts: ^8.0.2
  pinput: ^6.0.2
  image_picker: ^1.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  flutter_screenutil: ^5.9.0
  video_player: ^2.11.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # flutter_launcher_icons: ^0.14.3  # 👈 added here

flutter:
  uses-material-design: true
  assets:
    - assets/images/png/
    - assets/svg/
    - assets/fonts/
  fonts:
    - family: CooperBlack
      fonts:
        - asset: assets/fonts/Cooper Black.ttf
